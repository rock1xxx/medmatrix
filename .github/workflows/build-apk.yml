name: Build MedMatrix Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# Only the newest push should publish the rolling android-latest APK, otherwise
# two overlapping runs race on --clobber and an older build can win.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Native Android APK with Widget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build
        env:
          # Optional: add these as repository secrets so every freshly installed APK
          # reconnects to your Supabase project automatically and pulls your progress.
          # If unset, the app simply starts local-only as before.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync Native Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName="1.0.${{ github.run_number }}" \
            --no-daemon --stacktrace

      - name: Rename APK for Easy Download
        run: |
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} android/app/build/outputs/apk/debug/MedMatrix.apk \;
          ls -la android/app/build/outputs/apk/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedMatrix-Android-App
          path: android/app/build/outputs/apk/debug/MedMatrix.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        run: |
          BUILD_TAG="v1.0.${{ github.run_number }}"
          echo "Publishing release $BUILD_TAG..."

          # 1. Update rolling android-latest release assets
          gh release upload android-latest android/app/build/outputs/apk/debug/MedMatrix.apk --clobber || \
          gh release create android-latest android/app/build/outputs/apk/debug/MedMatrix.apk \
            --title "MedMatrix Android App (APK with One UI Widget)" \
            --notes "Compiled for Android 14+ / Samsung Galaxy S24 Ultra. Rolling latest release."

          # 2. Publish the build metadata next to the APK. The app compares this
          #    versionCode with its own to decide whether an update really exists.
          printf '{"versionCode":%s,"versionName":"1.0.%s"}' \
            "${{ github.run_number }}" "${{ github.run_number }}" > version.json
          gh release upload android-latest version.json --clobber

          # 3. Put the build number in the release title. The app compares it with its
          #    own versionCode; release assets are served without CORS headers, so the
          #    title is the only place a WebView can read it from.
          gh release edit android-latest \
            --title "MedMatrix Android App (APK with One UI Widget) — build ${{ github.run_number }}" \
            --notes "Compiled for Android 14+ / Samsung Galaxy S24 Ultra. Rolling latest release, build ${{ github.run_number }}."

          # 4. Publish permanent versioned release for this build run
          gh release create "$BUILD_TAG" android/app/build/outputs/apk/debug/MedMatrix.apk \
            --title "MedMatrix Build #${{ github.run_number }}" \
            --notes "Automated APK build for commit ${{ github.sha }} with native One UI 4x1, 4x2, and 2x2 widgets." \
            --latest || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

