name: Build MedMatrix Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK with Widget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Native Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Download
        run: |
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} android/app/build/outputs/apk/debug/MedMatrix.apk \;
          ls -la android/app/build/outputs/apk/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedMatrix-Android-App
          path: android/app/build/outputs/apk/debug/MedMatrix.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release Latest APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-latest
          name: "MedMatrix Android App (APK with One UI Widget)"
          overwrite: true
          make_latest: true
          body: |
            ### 📱 MedMatrix Native Android App
            Compiled directly for Android 14+ / Samsung Galaxy S24 Ultra.

            #### 📥 How to Install on your S24 Ultra:
            1. Download `MedMatrix.apk` directly on your phone.
            2. Tap the downloaded file to install (allow "Install unknown apps" if prompted).
            3. Open the app once to load your study desk.
            
            #### 🌟 How to Add the Resizable Widget:
            1. Long-press an empty space on your **S24 Ultra Home Screen**.
            2. Tap **Widgets**.
            3. Scroll to **MedMatrix** &rarr; select **MedMatrix Today**.
            4. Drag it to your home screen and resize it freely!
          files: android/app/build/outputs/apk/debug/MedMatrix.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
